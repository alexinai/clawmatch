<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="clawGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF2D75;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D2FF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#1a1a2e" opacity="0.95"/>

  <!-- Lobster claw design - simplified and iconic -->
  <!-- Main claw body -->
  <path d="M 256 180 Q 280 160 320 160 Q 360 160 380 190 Q 390 210 380 240 L 360 280 Q 350 300 320 300 L 280 300 Q 260 290 250 270 L 256 180 Z"
        fill="url(#clawGradient)"
        filter="url(#glow)"
        opacity="0.9"/>

  <!-- Upper pincer -->
  <path d="M 360 280 Q 380 270 400 250 Q 410 240 405 225 Q 400 215 385 220 Q 370 225 360 240 L 360 280 Z"
        fill="#FF2D75"
        filter="url(#glow)"/>

  <!-- Lower pincer -->
  <path d="M 320 300 Q 340 320 360 340 Q 370 350 375 340 Q 380 330 370 315 Q 360 305 345 305 L 320 300 Z"
        fill="#00D2FF"
        filter="url(#glow)"/>

  <!-- Left small claw (mirror) -->
  <path d="M 256 180 Q 232 160 192 160 Q 152 160 132 190 Q 122 210 132 240 L 152 280 Q 162 300 192 300 L 232 300 Q 252 290 262 270 L 256 180 Z"
        fill="url(#clawGradient)"
        filter="url(#glow)"
        opacity="0.9"/>

  <!-- Left upper pincer -->
  <path d="M 152 280 Q 132 270 112 250 Q 102 240 107 225 Q 112 215 127 220 Q 142 225 152 240 L 152 280 Z"
        fill="#FF2D75"
        filter="url(#glow)"/>

  <!-- Left lower pincer -->
  <path d="M 192 300 Q 172 320 152 340 Q 142 350 137 340 Q 132 330 142 315 Q 152 305 167 305 L 192 300 Z"
        fill="#00D2FF"
        filter="url(#glow)"/>

  <!-- Center accent - eye/dot -->
  <circle cx="256" cy="220" r="8" fill="#00D2FF" filter="url(#glow)"/>

  <!-- Bottom decorative element - antenna/tail -->
  <path d="M 256 270 Q 256 320 240 360 Q 235 375 245 380 Q 255 382 260 370 Q 268 350 268 330 Q 268 300 256 270 Z"
        fill="#FF2D75"
        opacity="0.6"
        filter="url(#glow)"/>
</svg>
